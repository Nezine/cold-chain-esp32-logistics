name: C++ backend and firmware
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config make
      - name: Prepare pinned local dependencies and build C++
        run: bash 02-domain-backend/tools/setup.sh
      - name: Run backend, API, bridge and sensor checks
        run: bash 02-domain-backend/tools/check.sh
      - name: Rehearse complete demo with restart
        run: python3 02-domain-backend/tools/demo.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Compile pinned ESP32 target
        run: pio run -d 04-esp32-sensor -j 2
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-frontend/exercises/esp32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 03-frontend/exercises/esp32/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test backend integration behavior
        run: npm test -- --watchAll=false --runInBand
      - name: Build dashboard
        run: npm run build
